[project]
name = "xiaobai-one-api"
version = "0.1.0"
description = "小白一号 API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<0.117.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
  "cryptography>=45.0.0,<46.0.0",
  "httpx>=0.28.0,<0.29.0",
  "docker>=7.1.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
